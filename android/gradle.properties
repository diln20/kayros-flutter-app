# Configuracion ligera para equipos de 16 GB de RAM con Android Studio y un emulador.
# Gradle puede usar hasta 2,5 GB de heap; el valor anterior era de 8 GB.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=384m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Menos trabajadores simultaneos para evitar paginacion de memoria en Windows.
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.daemon.idletimeout=900000

android.useAndroidX=true
